name: Release logger

on:
  push:
    paths:
      - '.github/workflows/deploy-logger.yml'
      - 'Logger/**'
      - '!Logger/manifests/kustomization.yaml'

concurrency:
  group: kustomize-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOCKERHUB_NAMESPACE: eetujukka
  PINGPONG_IMAGE: pingpong
  LOG_OUTPUT_SERVER_IMAGE: log-output-server
  LOG_OUTPUT_LOGGER_IMAGE: log-output-logger

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish images
        run: |-
          docker build --tag "$DOCKERHUB_NAMESPACE/$PINGPONG_IMAGE:$GITHUB_SHA" Logger/PingPong
          docker build --tag "$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_SERVER_IMAGE:$GITHUB_SHA" Logger/LogOutput/server
          docker build --tag "$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_LOGGER_IMAGE:$GITHUB_SHA" Logger/LogOutput/logger

          docker push "$DOCKERHUB_NAMESPACE/$PINGPONG_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_SERVER_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_LOGGER_IMAGE:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: Logger/manifests
        run: |-
          kustomize edit set image \
            "$DOCKERHUB_NAMESPACE/$PINGPONG_IMAGE=$DOCKERHUB_NAMESPACE/$PINGPONG_IMAGE:$GITHUB_SHA" \
            "$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_SERVER_IMAGE=$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_SERVER_IMAGE:$GITHUB_SHA" \
            "$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_LOGGER_IMAGE=$DOCKERHUB_NAMESPACE/$LOG_OUTPUT_LOGGER_IMAGE:$GITHUB_SHA"

      - name: Rebase release changes
        run: git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'Logger/manifests/kustomization.yaml'
          message: New version released ${{ github.sha }}
