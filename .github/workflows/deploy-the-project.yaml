name: Release the project

on:
  push:
    paths:
      - '.github/workflows/deploy-the-project.yaml'
      - 'TheProject/**'
      - '!TheProject/manifests/kustomization.yaml'

concurrency:
  group: kustomize-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: devops-with-kubernetes
  FRONTEND_IMAGE: devops-with-kubernetes-frontend
  BACKEND_IMAGE: devops-with-kubernetes-backend

jobs:
  build-publish-deploy:
    name: Build, Publish and Release
    runs-on: ubuntu-latest
    environment: Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - name: 'Configure Docker authentication'
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: 'Form the image names'
        run: |-
          echo "FRONTEND_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$FRONTEND_IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BACKEND_IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: |-
          docker build --tag "$FRONTEND_IMAGE_TAG" TheProject/frontend
          docker build --tag "$BACKEND_IMAGE_TAG" TheProject/backend

      - name: Publish
        run: |-
          docker push "$FRONTEND_IMAGE_TAG"
          docker push "$BACKEND_IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: TheProject/manifests
        run: |-
          kustomize edit set image \
            eetujukka/devops-with-kubernetes-frontend="$FRONTEND_IMAGE_TAG" \
            eetujukka/devops-with-kubernetes-backend="$BACKEND_IMAGE_TAG"

      - name: Rebase release changes
        run: git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'TheProject/manifests/kustomization.yaml'
          message: New project version released ${{ github.sha }}
