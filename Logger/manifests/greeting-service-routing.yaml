apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeting-service
  namespace: logger
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: greeting-service-svc
      port: 3003
  rules:
    - backendRefs:
        - name: greeting-service-svc-v1
          port: 3003
          weight: 75
        - name: greeting-service-svc-v2
          port: 3003
          weight: 25
