apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: logger-gateway
spec:
  selector:
    istio: loggergateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: logger-virtua-service
spec:
  hosts:
    - "*"
  gateways:
    - logger-gateway
  http:
    - match:
        - uri:
            prefix: /log-output
      rewrite:
        uri: /
      route:
        - destination:
            host: log-output-svc
            port:
              number: 2345
          weight: 50
        - destination:
            host: log-output-svc-v2
            port:
              number: 2345
          weight: 50
    - match:
        - uri:
            prefix: /pingpong
      rewrite:
        uri: /
      route:
        - destination:
            host: pingpong-svc
            port:
              number: 6789
