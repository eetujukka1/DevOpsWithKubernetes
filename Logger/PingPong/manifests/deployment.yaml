apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pingpong-dep
  namespace: logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  strategy:
    canary:
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: cpu-usage
        - setWeight: 50
        - pause:
            duration: 30s
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: pingpong-postgres-data-storage
          persistentVolumeClaim:
            claimName: log-ping-pong-claim
      containers:
        - name: pingpong
          image: eetujukka/pingpong:1.17
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              path: /healthz
              port: 3002
          env:
            - name: PORT
              value: "3002"
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "pingpong"
            - name: PGUSER
              value: "pingpong"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingpong-postgres-password
                  key: POSTGRES_PASSWORD
        - name: pingpong-postgres
          image: postgres:18.4-alpine3.24
          env:
            - name: POSTGRES_DB
              value: "pingpong"
            - name: POSTGRES_USER
              value: "pingpong"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingpong-postgres-password
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pingpong-postgres-data-storage
              mountPath: /var/lib/postgresql
